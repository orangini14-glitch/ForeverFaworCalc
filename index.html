<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Forever: Инструменты игрока</title>
    <style>
        :root {
            --bg: #1e1e2e; --surface: #2a2a3c; --text: #cdd6f4; --accent: #89b4fa;
            --gold: #f9e2af; --green: #a6e3a1; --red: #f38ba8; --border: #45475a;
            --hover: #313244;
            --bg-profit-high: rgba(166, 227, 161, 0.15);
            --border-profit-high: #a6e3a1;
            --bg-profit-mid: rgba(249, 226, 175, 0.1);
            --border-profit-mid: #f9e2af;
            --bg-profit-low: rgba(243, 139, 168, 0.15);
            --border-profit-low: #f38ba8;
            --rarity-uncommon: #1eff00;
            --rarity-common: #9d9d9d;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: background 0.3s; }
        h1 { color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; text-align: center; }
        .container { max-width: 1500px; margin: 0 auto; }
        
        /* Навигация */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
        .header h1 { border: none; margin: 0; padding: 0; }
        .lang-switch { display: flex; gap: 5px; background: var(--bg); padding: 4px; border-radius: 4px; border: 1px solid var(--border); }
        .lang-btn { background: transparent; color: var(--text); border: none; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .lang-btn.active { background: var(--accent); color: var(--bg); }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .nav-btn { padding: 12px 24px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        .nav-btn:hover { background: var(--hover); }
        .nav-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Общие стили для элементов управления */
        .controls { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; align-items: center; background: var(--surface); padding: 15px; border-radius: 8px; justify-content: center; }
        .controls label { font-weight: bold; }
        .controls select, .controls input { padding: 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
        .controls input[type="number"] { width: 80px; }
        .controls input[type="checkbox"] { width: auto; cursor: pointer; }
        .btn { padding: 10px 20px; background: var(--accent); color: var(--bg); border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #b4befe; }
        
        /* Таблицы */
        table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { background-color: #313244; position: sticky; top: 0; z-index: 10; user-select: none; }
        
        /* Стили для Калькулятора Торговых Обязательств */
        .crate-cell { border-right: 2px solid var(--border); background-color: #252535; width: 20%; vertical-align: middle; }
        .crate-content { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; height: 100%; }
        .crate-name { font-weight: bold; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.1em; flex-wrap: wrap; }
        .crate-meta { font-size: 0.9em; color: #a6adc8; display: flex; flex-direction: column; gap: 4px; align-items: center; }
        
        .resources-container { width: 80%; padding: 0; }
        .resource-row { display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid var(--border); transition: background-color 0.2s; }
        .resource-row:last-child { border-bottom: none; }
        
        .icon-link { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); transition: color 0.2s; flex: 1; min-width: 200px; }
        .icon-link:hover { color: var(--accent); }
        .icon-wrapper { border-radius: 4px; padding: 2px; display: inline-flex; }
        .icon-wrapper.common { border: 1px solid var(--rarity-common); }
        .icon-wrapper.uncommon { border: 1px solid var(--rarity-uncommon); box-shadow: inset 0 0 4px var(--rarity-uncommon); }
        .item-icon { width: 28px; height: 28px; border-radius: 2px; background-color: #000; object-fit: cover; display: block; }
        .item-icon-small { width: 20px; height: 20px; border-radius: 2px; vertical-align: middle; margin-right: 5px; border: 1px solid #000; }
        
        .row-high { background-color: var(--bg-profit-high); border-left: 4px solid var(--border-profit-high); }
        .row-mid { background-color: var(--bg-profit-mid); border-left: 4px solid var(--border-profit-mid); }
        .row-low { background-color: var(--bg-profit-low); border-left: 4px solid var(--border-profit-low); }
        
        .profit-text-high { color: var(--green); font-weight: bold; }
        .profit-text-mid { color: var(--gold); font-weight: bold; }
        .profit-text-low { color: var(--red); font-weight: bold; }
        .text-muted { color: #a6adc8; font-style: italic; }
        .profit-negative { color: #1eff00; font-weight: bold; text-shadow: 0 0 5px rgba(30, 255, 0, 0.5); }
        
        .price-info { display: flex; gap: 10px; align-items: center; min-width: 450px; justify-content: flex-end; }
        
        /* Стили для Калькулятора Профессий */
        .prof-step-row { transition: background-color 0.2s; }
        .prof-step-row:hover { background-color: var(--hover); }
        .skill-range { font-weight: bold; color: var(--accent); }
        .recipe-name { font-weight: bold; display: flex; align-items: center; }
        .materials-list { font-size: 0.9em; color: #a6adc8; display: flex; flex-direction: column; gap: 4px; }
        .material-item { display: flex; justify-content: space-between; align-items: center; }
        .material-cost { color: var(--gold); font-weight: bold; text-align: right; }
        .total-cost-row td { background-color: #313244; font-weight: bold; border-top: 2px solid var(--border); font-size: 1.1em; }
        
        .notes { font-size: 0.9em; color: #a6adc8; margin-top: 20px; padding: 15px; background: var(--surface); border-radius: 8px; border-left: 4px solid var(--accent); }
        
        .coin-icon { width: 14px; height: 14px; vertical-align: -2px; margin-left: 2px; margin-right: 4px; display: inline-block; }
        
        .col-price { width: 90px; text-align: right; }
        .col-total { width: 110px; text-align: right; color: #a6adc8; }
        .col-favor { width: 90px; text-align: right; }
        .col-net { width: 140px; text-align: right; font-weight: bold; }
        
        .th-resources-inner { display: flex; align-items: center; width: 100%; }
        .th-res-name { flex: 1; text-align: left; min-width: 200px; }
        .th-price-info { display: flex; gap: 10px; min-width: 450px; justify-content: flex-end; }
    </style>
</head>
<body>
<div class="container">
    <!-- Шапка -->
    <div class="header">
        <h1 id="title-text">📦 WoW Forever: Инструменты игрока</h1>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLang('ru')">RU</button>
            <button class="lang-btn" onclick="setLang('en')">ENG</button>
        </div>
    </div>

    <!-- Навигация -->
    <div class="nav-tabs">
        <button class="nav-btn active" id="btn-tab-favor" onclick="switchTab('favor')">Торговые обязательства</button>
        <button class="nav-btn" id="btn-tab-prof" onclick="switchTab('prof')">Калькулятор профессий</button>
        <button class="nav-btn" id="btn-tab-soon" onclick="switchTab('soon')">Coming soon...</button>
    </div>

    <!-- Вкладка 1: Торговые обязательства -->
    <div id="tab-favor" class="tab-content active">
        <div class="controls">
            <div>
                <label for="maxLevel" id="lbl-maxLevel">Макс. уровень:</label>
                <input type="number" id="maxLevel" value="60" min="1" max="60">
            </div>
            <div>
                <label for="sortBy" id="lbl-sortBy">Сортировать:</label>
                <select id="sortBy">
                    <option value="level" id="opt-level">По уровню</option>
                    <option value="costAsc" id="opt-costAsc">По выгоде (дешевле)</option>
                    <option value="costDesc" id="opt-costDesc">По выгоде (дороже)</option>
                    <option value="name" id="opt-name">По названию</option>
                </select>
            </div>
            <div style="display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" id="onlyBest">
                <label for="onlyBest" id="lbl-onlyBest" style="cursor: pointer;">Выгодное</label>
            </div>
        </div>

        <table id="resultsTable">
            <thead>
                <tr>
                    <th id="th-crate">Ящик / Уровень</th>
                    <th id="th-resources">
                        <div class="th-resources-inner">
                            <span class="th-res-name" id="th-res-name">Варианты ресурсов</span>
                            <div class="th-price-info">
                                <span class="col-price" id="th-price-item">Цена / шт.</span>
                                <span class="col-total" id="th-price-total" title="Ресурсы + Ящик">Общая ст-ть</span>
                                <span class="col-favor" id="th-cost-favor">Цена 1 Favor</span>
                                <span class="col-net" id="th-cost-net">С учетом дохода</span>
                            </div>
                        </div>
                    </th>
                </tr>
            </thead>
            <tbody id="favorBody"></tbody>
        </table>
    </div>

    <!-- Вкладка 2: Профессии -->
    <div id="tab-prof" class="tab-content">
        <div class="controls">
            <div>
                <label for="professionSelect" id="lbl-profession">Профессия:</label>
                <select id="professionSelect">
                    <option value="blacksmithing" id="opt-bs">Кузнечное дело (Blacksmithing)</option>
                </select>
            </div>
            <div>
                <label for="currentSkill" id="lbl-current">Текущий навык:</label>
                <input type="number" id="currentSkill" value="1" min="1" max="300">
            </div>
            <div>
                <label for="targetSkill" id="lbl-target">Целевой навык:</label>
                <input type="number" id="targetSkill" value="300" min="1" max="300">
            </div>
            <button class="btn" onclick="renderProfessions()" id="btn-update-prof">Обновить</button>
        </div>

        <table id="profTable">
            <thead>
                <tr>
                    <th id="th-skill">Уровень</th>
                    <th id="th-recipe">Рецепт</th>
                    <th id="th-mats">Материалы (на 1 крафт)</th>
                    <th id="th-crafts">Крафтов</th>
                    <th id="th-total-prof" style="text-align: right;">Общая стоимость</th>
                </tr>
            </thead>
            <tbody id="profBody"></tbody>
        </table>
    </div>

    <!-- Вкладка 3: Coming Soon -->
    <div id="tab-soon" class="tab-content">
        <div style="text-align: center; padding: 50px; font-size: 1.5em; color: #a6adc8;">
            🚧 В разработке... 🚧
        </div>
    </div>

</div>

    function formatWoWMoney(copperValue) {
        if (copperValue === null || copperValue === undefined || isNaN(copperValue)) return '—';
        const isNegative = copperValue < 0;
        const copper = Math.abs(Math.round(copperValue));
        const gold = Math.floor(copper / 10000);
        const silver = Math.floor((copper % 10000) / 100);
        const remainingCopper = copper % 100;
        const goldIcon = '<img src="https://wow.zamimg.com/images/wow/icons/medium/inv_misc_coin_01.jpg" class="coin-icon">';
        const silverIcon = '<img src="https://wow.zamimg.com/images/wow/icons/medium/inv_misc_coin_03.jpg" class="coin-icon">';
        const copperIcon = '<img src="https://wow.zamimg.com/images/wow/icons/medium/inv_misc_coin_05.jpg" class="coin-icon">';
        let result = '';
        if (gold > 0) result += `${gold} ${goldIcon} `;
        if (silver > 0 || (gold > 0 && remainingCopper > 0)) result += `${silver} ${silverIcon} `;
        if (remainingCopper > 0 || (gold === 0 && silver === 0)) result += `${remainingCopper} ${copperIcon}`;
        let formatted = result.trim();
        if (isNegative && formatted !== '') formatted = '-' + formatted;
        return formatted || '0';
    }

    function getPrice(itemId) {
        if (window.AUCTION_DATA && window.AUCTION_DATA[String(itemId)] !== undefined) {
            return window.AUCTION_DATA[String(itemId)];
        }
        return null;
    }

        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('btn-tab-' + tabId).classList.add('active');
    }

                if (price !== null) {
                    totalCost = (price * opt.qty) + cratePrice;
                    costPerFavor = totalCost / crate.favor;
                    if (crate.gold_reward !== undefined) {
                        netCostPerFavor = (totalCost - crate.gold_reward) / crate.favor;
                    }
                }
                crateOptions.push({ name: opt.name, qty: opt.qty, price, totalCost, costPerFavor, netCostPerFavor });
            });
            
            crateOptions.sort((a, b) => (a.netCostPerFavor === null) ? 1 : (b.netCostPerFavor === null) ? -1 : a.netCostPerFavor - b.netCostPerFavor);
            const validOptions = crateOptions.filter(o => o.netCostPerFavor !== null);
            const bestCost = validOptions.length > 0 ? validOptions[0].netCostPerFavor : Infinity;
            
            preparedData.push({ ...crate, price: cratePrice, options: crateOptions, bestCost });
        });

        preparedData.sort((a, b) => {
            if (sortBy === 'level') return a.level - b.level;
            if (sortBy === 'costAsc') return a.bestCost === Infinity ? 1 : b.bestCost === Infinity ? -1 : a.bestCost - b.bestCost;
            if (sortBy === 'costDesc') return a.bestCost === Infinity ? 1 : b.bestCost === Infinity ? -1 : b.bestCost - a.bestCost;
            if (sortBy === 'name') return a.name_ru.localeCompare(b.name_ru);
            return 0;
        });

        preparedData.forEach(crate => {
            const tr = document.createElement('tr');
            const rarityClass = crate.rarity === 'uncommon' ? 'uncommon' : 'common';
            
            const crateCellHtml = `
                <td class="crate-cell">
                    <div class="crate-content">
                        <div class="crate-name">
                            <a href="#" onclick="return false;" class="icon-link" style="justify-content: center;">
                                <div class="icon-wrapper ${rarityClass}" style="width: 36px; height: 36px;">
                                    <img src="https://wow.zamimg.com/images/wow/icons/medium/${crate.icon}.jpg" class="item-icon" style="width: 100%; height: 100%;">
                                </div>
                                ${crate.name_ru}
                            </a>
                        </div>
                        <div class="crate-meta">
                            <div>${t.crateLevel} <strong>${crate.level}</strong></div>
                            <div>${t.crateFavor} <strong>${crate.favor} Favor</strong></div>
                            <div style="color: var(--gold);">${t.crateGoldReward} <strong>${formatWoWMoney(crate.gold_reward)}</strong></div>
                            <div>${t.cratePrice} <strong>${crate.price ? formatWoWMoney(crate.price) : t.noPrice}</strong></div>
                        </div>
                    </div>
                </td>
            `;
            
            let resourcesHtml = '<td class="resources-container">';
            let optionsToShow = onlyBest ? [crate.options[0]] : crate.options;

            const validOptions = crate.options.filter(o => o.netCostPerFavor !== null);
            const bestCost = validOptions.length > 0 ? validOptions[0].netCostPerFavor : 0;
            const worstCost = validOptions.length > 0 ? validOptions[validOptions.length - 1].netCostPerFavor : 0;
            const diff = worstCost - bestCost;

            optionsToShow.forEach(opt => {
                const itemInfo = itemDB[opt.name];
                let rowClass = 'row-mid', textClass = 'profit-text-mid', netTextClass = '';
                
                if (opt.netCostPerFavor !== null) {
                    if (opt.netCostPerFavor < 0) { rowClass = 'row-high'; textClass = 'profit-text-high'; netTextClass = 'profit-negative'; }
                    else if (onlyBest || opt.netCostPerFavor === bestCost || (diff > 0 && opt.netCostPerFavor < bestCost + (diff * 0.3))) { rowClass = 'row-high'; textClass = 'profit-text-high'; }
                    else if (opt.netCostPerFavor === worstCost || (diff > 0 && opt.netCostPerFavor > worstCost - (diff * 0.3))) { rowClass = 'row-low'; textClass = 'profit-text-low'; }
                } else { rowClass = ''; textClass = 'text-muted'; }

                resourcesHtml += `
                    <div class="resource-row ${rowClass}">
                        <a href="#" onclick="return false;" class="icon-link">
                            <div class="icon-wrapper common">
                                <img src="https://wow.zamimg.com/images/wow/icons/medium/${itemInfo ? itemInfo.icon : 'inv_misc_questionmark'}.jpg" class="item-icon">
                            </div>
                            <span style="font-weight: 500;">${itemInfo ? itemInfo.name_ru : opt.name} × ${opt.qty}</span>
                        </a>
                        <div class="price-info">
                            <span class="col-price" style="color: #a6adc8;">${opt.price !== null ? formatWoWMoney(opt.price) : t.noPrice}</span>
                            <span class="col-total">${opt.totalCost !== null ? formatWoWMoney(opt.totalCost) : t.noPrice}</span>
                            <span class="col-favor ${textClass}">${opt.costPerFavor !== null ? formatWoWMoney(opt.costPerFavor) : t.noPrice}</span>
                            <span class="col-net ${netTextClass || textClass}" style="font-size: 1.1em;">${opt.netCostPerFavor !== null ? formatWoWMoney(opt.netCostPerFavor) : t.noPrice}</span>
                        </div>
                    </div>
                `;
            });
            resourcesHtml += '</td>';
            tr.innerHTML = crateCellHtml + resourcesHtml;
            tableBody.appendChild(tr);
        });
    }

    // --- РЕНДЕР ПРОФЕССИЙ ---
    function renderProfessions() {
        const t = translations[currentLang];
        const currentSkill = parseInt(document.getElementById('currentSkill').value) || 1;
        const targetSkill = parseInt(document.getElementById('targetSkill').value) || 300;
        const tbody = document.getElementById('profBody');
        tbody.innerHTML = '';

        let grandTotalCost = 0;
        let hasMissingPrices = false;

        blacksmithingRoute.forEach(step => {
            const [start, end, name_ru, name_en, icon, materials, isTrainer] = step;
            if (end <= currentSkill || start >= targetSkill) return;

            const craftsNeeded = end - start;
            let stepTotalCost = 0;
            let materialsHtml = '';

            for (const [matId, qty] of Object.entries(materials)) {
                const price = getPrice(matId);
                const totalMatCost = price ? price * qty * craftsNeeded : 0;
                if (price === null) hasMissingPrices = true;
                stepTotalCost += totalMatCost;
                
                const matName = itemDB[matId] ? itemDB[matId].name_ru : `Item ${matId}`;
                const matIcon = itemDB[matId] ? itemDB[matId].icon : 'inv_misc_questionmark';
                const priceDisplay = price !== null ? formatWoWMoney(price) : '—';

                materialsHtml += `
                    <div class="material-item">
                        <span>
                            <img src="https://wow.zamimg.com/images/wow/icons/small/${matIcon}.jpg" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 4px;">
                            ${matName} × ${qty}
                        </span>
                        <span class="material-cost">${priceDisplay}</span>
                    </div>
                `;
            }

            grandTotalCost += stepTotalCost;
            const recipeName = currentLang === 'ru' ? name_ru : name_en;

            const tr = document.createElement('tr');
            tr.className = 'prof-step-row';
            tr.innerHTML = `
                <td class="skill-range">${start} - ${end}</td>
                <td class="recipe-name">
                    <span style="margin-right: 8px;">${isTrainer ? '📖' : '💰'}</span>
                    <img src="https://wow.zamimg.com/images/wow/icons/small/${icon}.jpg" class="item-icon-small">
                    ${recipeName}
                </td>
                <td><div class="materials-list">${materialsHtml}</div></td>
                <td>${craftsNeeded} шт.</td>
                <td class="material-cost">${stepTotalCost > 0 ? formatWoWMoney(stepTotalCost) : '—'}</td>
            `;
            tbody.appendChild(tr);
        });

        const totalTr = document.createElement('tr');
        totalTr.className = 'total-cost-row';
        totalTr.innerHTML = `<td colspan="4" style="text-align: right;">${t.totalRoute}</td><td class="material-cost">${grandTotalCost > 0 ? formatWoWMoney(grandTotalCost) : '—'}</td>`;
        tbody.appendChild(totalTr);

        if (hasMissingPrices) {
            const warnTr = document.createElement('tr');
            warnTr.innerHTML = `<td colspan="5" style="color: var(--red); text-align: center; font-size: 0.9em;">${t.missingPrices}</td>`;
            tbody.appendChild(warnTr);
        }
    }

    // --- СЛУШАТЕЛИ СОБЫТИЙ ---
    window.onload = () => { 
        setLang('ru'); 
    };

    document.getElementById('maxLevel').addEventListener('change', renderFavorTable);
    document.getElementById('sortBy').addEventListener('change', renderFavorTable);
    document.getElementById('onlyBest').addEventListener('change', renderFavorTable);

</script>
</body>
</html>
